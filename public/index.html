<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
            color: #fff;
        }

        .upload-area {
            border: 2px dashed #4a4a4a;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #6a6a6a;
            background: #333;
        }

        .upload-area.dragover {
            border-color: #4a9eff;
            background: #2a3a4a;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #b0b0b0;
            margin-bottom: 10px;
        }

        .file-input {
            display: none;
        }

        .file-info {
            background: #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .file-info.active {
            display: block;
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .file-size {
            color: #888;
            font-size: 14px;
        }

        .progress-container {
            margin-bottom: 20px;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #3a3a3a;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #357abd);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #b0b0b0;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4a9eff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #357abd;
        }

        .btn-primary:disabled {
            background: #3a3a3a;
            color: #666;
            cursor: not-allowed;
        }

        .btn-cancel {
            background: #d64545;
            color: #fff;
        }

        .btn-cancel:hover {
            background: #a83434;
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .status-message.active {
            display: block;
        }

        .status-message.success {
            background: #2d5a2d;
            color: #7fd87f;
        }

        .status-message.error {
            background: #5a2d2d;
            color: #f87f7f;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📁 File Upload</h1>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Click to select a file or drag & drop</div>
            <div class="upload-text" style="font-size: 12px;">Max size: 2 GB</div>
        </div>

        <input type="file" id="fileInput" class="file-input">

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="uploadBtn" disabled>Upload File</button>
            <button class="btn btn-cancel" id="cancelBtn" style="display: none;">Cancel</button>
        </div>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const statusMessage = document.getElementById('statusMessage');

        const MAX_FILE_SIZE = 2 * 1024 * 1024 * 1024; // 2 GB
        let selectedFile = null;
        let uploadAbortController = null;

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (file.size > MAX_FILE_SIZE) {
                showStatus('File size exceeds 2 GB limit', 'error');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('active');
            uploadBtn.disabled = false;
            hideStatus();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        uploadBtn.addEventListener('click', uploadFile);
        cancelBtn.addEventListener('click', cancelUpload);

        async function uploadFile() {
            if (!selectedFile) return;

            uploadAbortController = new AbortController();
            uploadBtn.style.display = 'none';
            cancelBtn.style.display = 'block';
            progressContainer.classList.add('active');
            hideStatus();

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);

                const xhr = new XMLHttpRequest();

                // Track upload progress
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        updateProgress(percentComplete);
                    }
                });

                // Handle completion
                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        updateProgress(100);
                        showStatus('File uploaded successfully! ✓', 'success');
                        setTimeout(resetUpload, 2000);
                    } else {
                        const error = JSON.parse(xhr.responseText);
                        showStatus('Upload failed: ' + (error.error || 'Unknown error'), 'error');
                        resetUpload();
                    }
                });

                // Handle errors
                xhr.addEventListener('error', () => {
                    showStatus('Upload failed: Network error', 'error');
                    resetUpload();
                });

                xhr.addEventListener('abort', () => {
                    showStatus('Upload cancelled', 'error');
                    resetUpload();
                });

                // Start upload
                xhr.open('POST', '/upload');
                xhr.send(formData);

                // Store xhr for cancellation
                uploadAbortController.xhr = xhr;

            } catch (error) {
                console.error('Upload error:', error);
                showStatus('Upload failed: ' + error.message, 'error');
                resetUpload();
            }
        }

        function cancelUpload() {
            if (uploadAbortController && uploadAbortController.xhr) {
                uploadAbortController.xhr.abort();
            }
        }

        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
            progressText.textContent = percent + '%';
        }

        function resetUpload() {
            uploadBtn.style.display = 'block';
            cancelBtn.style.display = 'none';
            progressContainer.classList.remove('active');
            updateProgress(0);
            uploadAbortController = null;
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message active ' + type;
        }

        function hideStatus() {
            statusMessage.classList.remove('active');
        }
    </script>
</body>

</html>
